name: CI

on:
  push:
  pull_request:

# No secrets: the LLM chain falls back to the offline mock engine, and Mirage is replaced by recorded outputs.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Python venv for the Mirage service tests (fake model, no weights)
        run: |
          python -m venv services/mirage/.venv
          services/mirage/.venv/bin/pip install -q fastapi uvicorn python-multipart pillow pytest httpx
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:py
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
        env:
          E2E_PROD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
